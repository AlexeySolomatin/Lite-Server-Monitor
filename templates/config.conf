# ==============================================================================
# Lite Server Monitor (LSM)
# Основной конфигурационный файл
#
# Каталог: /etc/lsm/config.conf
# Файл создается мастером установки и может редактироваться вручную.
#
# Секретные данные (токены, пароли) хранятся отдельно в /etc/lsm/secrets.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# Журналирование
# ------------------------------------------------------------------------------

# Уровень журналирования: DEBUG | INFO | WARN | ERROR
LOG_LEVEL="INFO"

# Путь к файлу журнала
LOG_FILE="/var/log/lsm/lsm.log"

# ------------------------------------------------------------------------------
# Уведомления: защита от спама
# ------------------------------------------------------------------------------

# Минимальный интервал между повторными алертами одного модуля (секунды)
ALERT_COOLDOWN=3600

# ------------------------------------------------------------------------------
# Каналы уведомлений
# ------------------------------------------------------------------------------

# Включение каналов доставки (true | false)
TELEGRAM_ENABLED="false"
EMAIL_ENABLED="false"

# ------------------------------------------------------------------------------
# Email / SMTP
# ------------------------------------------------------------------------------

# Адрес SMTP-сервера. Если задан и установлена утилита msmtp,
# отправка выполняется через msmtp с указанными параметрами.
SMTP_SERVER=""
SMTP_PORT="587"

# Шифрование TLS: on | off | starttls
SMTP_TLS="on"

# Адрес отправителя писем
SMTP_FROM=""

# Получатель уведомлений.
# Поддерживаются оба имени переменной: ALERT_EMAIL и EMAIL_TO.
ALERT_EMAIL=""
EMAIL_TO=""

# ------------------------------------------------------------------------------
# Ежедневный отчет
# ------------------------------------------------------------------------------

# Включение ежедневного сводного отчета (true | false)
DAILY_REPORT_ENABLED="false"

# Время отправки ежедневного отчета (HH:MM)
DAILY_REPORT_TIME="09:00"

# ------------------------------------------------------------------------------
# ИБП (UPS)
# ------------------------------------------------------------------------------

# Мониторинг ИБП включается модулем ups (true | false)
UPS_ENABLED="false"

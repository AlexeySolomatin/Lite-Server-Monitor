name: Auto Version Bump

on:
  push:
    branches:
      - main  # Укажи master, если твоя ветка называется master

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Чеккаут кода (со всеми тегами и историей)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Расчет и запись новой версии
        id: bump
        run: |
          chmod +x ./lib/installer/auto-version.sh
          ./lib/installer/auto-version.sh
          
          # Читаем обновившийся файл VERSION и сохраняем в переменную $GITHUB_ENV
          NEW_VER=$(cat VERSION | tr -d '\r\n ')
          echo "NEW_VERSION=${NEW_VER}" >> $GITHUB_ENV

      # === НОВЫЙ ШАГ: Обновляем README перед коммитом ===
      - name: Обновление версии в README.md
        run: |
          perl -0777 -pi -e "s/<!-- version:start -->.*?<!-- version:end -->/<!-- version:start -->${{ env.NEW_VERSION }}<!-- version:end -->/s" README.md

      - name: Пуш файлов VERSION, README.md и создание Git-тега
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(release): bump version to ${{ env.NEW_VERSION }} [skip ci]"
          # Указываем экшену следить за изменениями ОБОИХ файлов
          file_pattern: 'VERSION README.md'
          tagging_message: 'v${{ env.NEW_VERSION }}'

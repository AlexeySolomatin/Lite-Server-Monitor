name: Auto-update README on Web Commit

on:
  push:
    paths:
      - 'VERSION'  # Чувствительно к регистру — заглавными буквами!

jobs:
  sync-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version
        id: read_version
        run: |
          # Читаем строго файл VERSION заглавными буквами
          VERSION=$(cat VERSION | tr -d '\r\n ')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Найдена версия: $VERSION"

      - name: Update README.md
        run: |
          perl -0777 -pi -e "s/<!-- version:start -->.*?<!-- version:end -->/<!-- version:start -->$VERSION<!-- version:end -->/s" README.md

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: sync README version to $VERSION [skip ci]"
            git push
          fi

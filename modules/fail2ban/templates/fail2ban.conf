#
# -----------------------------------------------------------------------------
# Lite Server Monitor (LSM)
# Конфигурация модуля мониторинга Fail2Ban
# Файл: /etc/lsm/modules/fail2ban.conf
# -----------------------------------------------------------------------------

#
# Список jail для мониторинга банов.
#
# Формат:
#
#   "" или "all"          — обрабатывать ВСЕ активные jail (по умолчанию);
#   "sshd"                — только указанный jail;
#   "sshd,nginx-badbot"   — список jail через запятую.
#
# В режиме check новые баны и разблокировки отслеживаются
# только по выбранным jail; в отчете показываются только они.
#

MONITOR_JAILS=""

#
# Отправлять уведомление WARNING при появлении новых банов IP-адресов.
#
# true  — отправлять;
# false — не отправлять (diff-кэш при этом все равно обновляется).
#

NOTIFY_ON_BAN=true

#
# Отправлять recovery-уведомление (OK), когда забаненные ранее
# IP-адреса разблокированы (истёк срок бана). Отправляется только
# если ранее был отправлен алерт.
#
# true  — отправлять;
# false — не отправлять.
#

NOTIFY_ON_RECOVERY=true

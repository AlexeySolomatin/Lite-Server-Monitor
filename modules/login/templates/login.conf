#
# -----------------------------------------------------------------------------
# Lite Server Monitor (LSM)
# Конфигурация модуля контроля входов пользователей
# Файл: /etc/lsm/modules/login.conf
# -----------------------------------------------------------------------------

#
# Мониторить успешные входы по SSH.
#
# true  — события "Accepted password/publickey" из журнала ssh/sshd
#         обрабатываются;
# false — успешные входы игнорируются.
#

MONITOR_SSH=true

#
# Мониторить неудачные попытки входа.
#
# true  — события "Failed password" / "Invalid user" обрабатываются;
# false — неудачные попытки игнорируются.
#

MONITOR_FAILED=true

#
# Отправлять информационное уведомление при каждом новом успешном входе.
#
# Сообщение отправляется через notify_info: сразу, без alert-семантики,
# без throttle-state и кулдауна.
#
# true  — отправлять;
# false — не отправлять (события по-прежнему фиксируются в журнале LSM).
#

NOTIFY_ON_LOGIN=true

#
# Отправлять алерт WARNING при неудачных попытках авторизации.
#
# Отправляется через notify с защитой от спама: повторные уведомления
# гасятся кулдауном ALERT_COOLDOWN (глобальная настройка LSM).
#
# true  — отправлять;
# false — не отправлять.
#

NOTIFY_ON_FAILED=true

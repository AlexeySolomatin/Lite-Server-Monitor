#
# -----------------------------------------------------------------------------
# Lite Server Monitor (LSM)
# Конфигурация модуля мониторинга RAID
# Файл: /etc/lsm/modules/raid.conf
# -----------------------------------------------------------------------------

#
# Уведомления.
#
# NOTIFY_ON_FAILURE — отправлять CRITICAL-уведомление
#                     при обнаружении проблемного массива;
#
# NOTIFY_ON_RECOVERY — отправлять recovery-уведомление (OK),
#                      когда состояние всех массивов восстановлено.
#
# true — отправлять, false — не отправлять.
#

NOTIFY_ON_FAILURE=true

NOTIFY_ON_RECOVERY=true

#
# Массивы, исключаемые из проверки (разделитель — пробел).
#
# Можно указывать как "md0", так и "/dev/md0".
#
# Пример:
#
#   IGNORE_ARRAYS="md0 /dev/md2"
#

IGNORE_ARRAYS=""

#
# -----------------------------------------------------------------------------
# Lite Server Monitor (LSM)
# Конфигурация модуля мониторинга ИБП (UPS)
# Файл: /etc/lsm/modules/ups.conf
# -----------------------------------------------------------------------------

#
# Пороги уровня заряда батареи, в процентах.
#

BATTERY_WARNING=50

BATTERY_CRITICAL=20


#
# Порог остатка времени автономной работы, в минутах.
#
# Если оставшееся время (TIMELEFT от apcupsd) меньше этого значения,
# отправляется WARNING-уведомление.
#

RUNTIME_WARNING=10


#
# Уведомления.
#
# NOTIFY_ON_BATTERY — предупреждать о переходе ИБП на питание от батареи;
#
# NOTIFY_ON_LOW_BATTERY — предупреждать о низком заряде
#                         и малом остатке времени работы;
#
# NOTIFY_ON_RECOVERY — отправлять recovery-уведомление (OK),
#                      когда питание от сети восстановлено.
#
# true — отправлять, false — не отправлять.
#

NOTIFY_ON_BATTERY=true

NOTIFY_ON_LOW_BATTERY=true

NOTIFY_ON_RECOVERY=true

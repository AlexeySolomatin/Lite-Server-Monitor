#
# -----------------------------------------------------------------------------
# Lite Server Monitor (LSM)
# Конфигурация модуля мониторинга системных ресурсов
# Файл: /etc/lsm/modules/system.conf
# -----------------------------------------------------------------------------

#
# Пороги загрузки CPU (load average за 1 минуту).
#
# Значения могут быть дробными (например, 5.0).
#

LOAD_WARNING=5.0

LOAD_CRITICAL=10.0


#
# Пороги использования памяти, в процентах.
#
# Расчет: (MemTotal - MemAvailable) / MemTotal * 100.
# При отсутствии MemAvailable используется MemFree.
#

MEMORY_WARNING=85

MEMORY_CRITICAL=95


#
# Пороги заполнения корневой файловой системы /, в процентах.
#

DISK_WARNING=85

DISK_CRITICAL=95


#
# Уведомления.
#
# NOTIFY_ON_WARNING — отправлять WARNING-уведомления
#                     (критические CRITICAL отправляются всегда);
# true — отправлять, false — не отправлять.
#
# NOTIFY_ON_RECOVERY — отправлять recovery-уведомление (OK),
#                      когда все метрики вернулись в норму после алерта;
# true — отправлять, false — не отправлять.
#

NOTIFY_ON_WARNING=true

NOTIFY_ON_RECOVERY=true

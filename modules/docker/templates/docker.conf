#
# -----------------------------------------------------------------------------
# Lite Server Monitor (LSM)
# Конфигурация модуля мониторинга Docker
# Файл: /etc/lsm/modules/docker.conf
# -----------------------------------------------------------------------------

#
# Включение/выключение модуля целиком.
#
# true  — проверки выполняются по расписанию таймера;
# false — модуль полностью отключен (все запуски завершаются без ошибок).
#

ENABLED=true

#
# Проверять активность службы docker.service.
#
# true  — при остановленной службе отправляется алерт CRITICAL;
# false — служба не проверяется.
#

CHECK_SERVICE=true

#
# Собирать статистику контейнеров (всего / запущено / остановлено).
#
# true  — статистика собирается в каждом режиме;
# false — контейнеры не учитываются.
#

CHECK_CONTAINERS=true

#
# Собирать данные об использовании дискового пространства
# командой docker system df (образы + контейнеры + тома).
#
# true  — данные собираются, объем сравнивается с порогом
#         STORAGE_WARNING_GB;
# false — хранилище не проверяется.
#

CHECK_STORAGE=true

#
# Предупреждать об остановленных контейнерах.
#
# true  — при наличии остановленных контейнеров отправляется
#         алерт WARNING;
# false — остановленные контейнеры игнорируются.
#

STOPPED_CONTAINER_WARNING=true

#
# Порог суммарного объема, занимаемого Docker (образы + контейнеры +
# тома), в гигабайтах. При превышении порога отправляется алерт WARNING.
#
# Значение задается целым числом.
#

STORAGE_WARNING_GB=50

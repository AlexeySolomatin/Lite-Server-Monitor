#
# -----------------------------------------------------------------------------
# Lite Server Monitor (LSM)
# Конфигурация модуля мониторинга SMART
# Файл: /etc/lsm/modules/smart.conf
# -----------------------------------------------------------------------------

#
# Устройства, исключаемые из проверки SMART.
#
# Разделитель — пробел. Можно указывать как короткие имена ("sda"),
# так и полные пути ("/dev/sda") — сравнение выполняется по basename.
#
# Пример:
#
#   IGNORE_DEVICES="sda nvme1 /dev/vdb"
#

IGNORE_DEVICES=""

#
# Отправлять уведомление CRITICAL при обнаружении сбоя SMART.
#
# true — отправлять;
# false — не отправлять.
#

NOTIFY_ON_FAILURE=true

#
# Отправлять recovery-уведомление (OK), когда статус SMART
# накопителя восстановился после ранее отправленного алерта.
#
# true — отправлять;
# false — не отправлять.
#

NOTIFY_ON_RECOVERY=true

#
# Показывать температуру накопителей в режиме report.
#
# Температура используется ТОЛЬКО для отображения в отчете,
# алерты по ней не формируются.
#
# true — показывать;
# false — скрывать колонку температуры.
#

REPORT_TEMPERATURE=true

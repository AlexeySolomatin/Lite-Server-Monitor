#
# -----------------------------------------------------------------------------
# Lite Server Monitor (LSM)
# Конфигурация модуля контроля температуры
# Файл: /etc/lsm/modules/temperature.conf
# -----------------------------------------------------------------------------

#
# Пороги температуры, °C (применяются к максимальному значению
# среди всех найденных датчиков).
#

WARNING_TEMP=70

CRITICAL_TEMP=80


#
# Уведомления.
#
# NOTIFY_ON_WARNING — отправлять WARNING-уведомления о перегреве
#                     (критические CRITICAL отправляются всегда);
# true — отправлять, false — не отправлять.
#
# NOTIFY_ON_RECOVERY — отправлять recovery-уведомление (OK),
#                      когда температура нормализовалась после алерта;
# true — отправлять, false — не отправлять.
#

NOTIFY_ON_WARNING=true

NOTIFY_ON_RECOVERY=true
